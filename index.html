<div id="gate">
  <form class="gate-box" onsubmit="return unlock(event)">

  </form>

<div id="app" hidden>
  <div class="wrap">

    <main id="dashboard"><p class="loading">Loading the latest snapshot…</p></main>

<script>
const PWHASH = "0f2cb44170f42cc966535f392a10dcd4499426df69dc476f1bf36609f7fa8c1e";
async function sha256hex(text){
  const enc=new TextEncoder().encode(text);
  if(window.crypto&&window.crypto.subtle){
    const buf=await window.crypto.subtle.digest("SHA-256",enc);
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  return sha256fallback(text);
}
function sha256fallback(ascii){
  function rotr(x,n){return (x>>>n)|(x<<(32-n));}
  const K=[1116352408,1899447441,3049323471,3921009573,961987163,1508970993,2453635748,2870763221,3624381080,310598401,607225278,1426881987,1925078388,2162078206,2614888103,3248222580,3835390401,4022224774,264347078,604807628,770255983,1249150122,1555081692,1996064986,2554220882,2821834349,2952999808,3210313671,3336571891,3584528711,113926993,338241895,666307205,773529912,1294757372,1396182291,1695183700,1986661051,2177026350,2456956037,2730485921,2820302411,3259730800,3345764771,3516065817,3600352804,4094571909,275423344,430227734,506948616,659060556,883997877,958139571,1322822218,1537002063,1747873779,1955562222,2024104815,2227730452,2361852424,2428436474,2756734187,3204031479,3329325298];
  function toWords(s){
    const bytes=[];
    for(let i=0;i<s.length;i++) bytes.push(s.charCodeAt(i)&0xff);
    const bitLen=bytes.length*8;
    bytes.push(0x80);
    while((bytes.length%64)!==56) bytes.push(0);
    for(let i=7;i>=0;i--) bytes.push((bitLen/Math.pow(2,i*8))&0xff);
    const w=[];
    for(let i=0;i<bytes.length;i+=4) w.push(((bytes[i]<<24)|(bytes[i+1]<<16)|(bytes[i+2]<<8)|bytes[i+3])>>>0);
    return w;
  }
  let h=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225];
  const words=toWords(unescape(encodeURIComponent(ascii)));
  for(let i=0;i<words.length;i+=16){
    const w=words.slice(i,i+16);
    for(let t=16;t<64;t++){
      const s0=rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>>3);
      const s1=rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    let [a,b,c,d,e,f,g,hh]=h;
    for(let t=0;t<64;t++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(hh+S1+ch+K[t]+w[t])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    h=h.map((x,i)=>(x+[a,b,c,d,e,f,g,hh][i])>>>0);
  }
  return h.map(x=>("00000000"+x.toString(16)).slice(-8)).join("");
}
function unlock(ev){
  ev.preventDefault();
  const val=document.getElementById("pw").value||"";
  sha256hex(val).then(h=>{
    if(h===PWHASH){sessionStorage.setItem("sbs_dash_ok","1");openApp();}
    else document.getElementById("gate-err").textContent="That passcode does not match.";
  });
  return false;
}
function openApp(){document.getElementById("gate").classList.add("hidden");document.getElementById("app").hidden=false;render();}

const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_SHORT=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const STATUS_COLOR={paying:"#8fbfa3",past_due:"#e08b84",no_active_sub:"#c6a46a",not_billed:"#8aa0b4"};
const PARTNER_COLOR={smarty:"#c6a46a",tom:"#7f97a6"};
const SEGMENT_ALT={smarty:"#e4d2ae"};
let charts=[];

function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));}
function cents(n){const x=Number(n);return Number.isFinite(x)?Math.round(x*100):null;}
function usd(n){return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(Number(n));}
function money(value,pending){
  if(pending||value===null||value===undefined||value==="") return {text:"pending",pending:true};
  return {text:usd(value),pending:false};
}
function moneyHtml(value,pending){
  const m=money(value,pending);
  return m.pending?`<span class="pending">${m.text}</span>`:esc(m.text);
}
function parseISO(iso){const p=String(iso).split("-").map(Number);return {y:p[0],m:p[1],d:p[2]};}
function utcDate(y,m,d){return new Date(Date.UTC(y,m-1,d));}
function isoFromDate(dt){
  const m=String(dt.getUTCMonth()+1).padStart(2,"0");
  const d=String(dt.getUTCDate()).padStart(2,"0");
  return dt.getUTCFullYear()+"-"+m+"-"+d;
}
function formatLong(iso){const p=parseISO(iso);return MONTHS[p.m-1]+" "+p.d+", "+p.y;}
function formatShort(iso){const p=parseISO(iso);return MONTHS_SHORT[p.m-1]+" "+p.d;}
function mondayOnOrBefore(iso){
  const p=parseISO(iso);
  const dt=utcDate(p.y,p.m,p.d);
  const day=dt.getUTCDay();
  dt.setUTCDate(dt.getUTCDate()+(day===0?-6:1-day));
  return isoFromDate(dt);
}
function mondaysInMonth(iso){
  const p=parseISO(iso);
  const last=new Date(Date.UTC(p.y,p.m,0)).getUTCDate();
  const out=[];
  for(let d=1;d<=last;d++){
    const dt=utcDate(p.y,p.m,d);
    if(dt.getUTCDay()===1) out.push(isoFromDate(dt));
  }
  return out;
}
function monthProgress(iso){
  const p=parseISO(iso);
  const days=new Date(Date.UTC(p.y,p.m,0)).getUTCDate();
  return {day:p.d,days:days,label:MONTHS[p.m-1],year:p.y};
}
function joinNames(names){
  if(names.length<=1) return names[0]||"";
  if(names.length===2) return names[0]+" and "+names[1];
  return names.slice(0,-1).join(", ")+", and "+names[names.length-1];
}
function partnerColor(id,index){
  if(PARTNER_COLOR[id]) return PARTNER_COLOR[id];
  const fallback=["#c6a46a","#7f97a6","#8fbfa3","#8aa0b4"];
  return fallback[index%fallback.length];
}
function nameOf(data,id){
  const found=(data.partners||[]).find(p=>p.id===id);
  return found?found.name:id;
}
function healthOf(p){
  if(p.profit_pending||p.profit===null||p.profit===undefined) return {label:"Pending",tone:"pending"};
  if(Number(p.profit)<0) return {label:"Loss",tone:"bad"};
  if(Number(p.profit)===0) return {label:"Flat",tone:"pending"};
  return {label:"Healthy",tone:"good"};
}
function bridges(p){
  if(p.profit_pending||p.profit===null||p.profit===undefined) return true;
  if(p.vendor_cost===null||p.vendor_cost===undefined) return true;
  const rev=cents(p.revenue), cost=cents(p.vendor_cost), profit=cents(p.profit);
  const aff=p.affiliate_payouts?cents(p.affiliate_payouts):0;
  if(rev===null||cost===null||profit===null||aff===null) return true;
  return rev-cost-aff===profit;
}
function revenueTie(data){
  const sum=(data.products||[]).reduce((s,p)=>s+(cents(p.revenue)||0),0);
  const stated=cents(data.kpis&&data.kpis.revenue);
  if(stated===null||sum===stated) return "";
  const diff=stated-sum;
  const direction=diff>0?"under":"over";
  return "Product lines sum to "+usd(sum/100)+", which is "+usd(Math.abs(diff)/100)+" "+direction+" the total above. That difference is not assigned to a line.";
}
function profitTie(data){
  let sum=0, any=false;
  (data.products||[]).forEach(p=>{
    if(p.profit_pending||p.profit===null||p.profit===undefined) return;
    sum+=cents(p.profit)||0;
    any=true;
  });
  const stated=cents(data.kpis&&data.kpis.profit);
  if(!any||stated===null||sum===stated) return "";
  return "Product profits that are not pending sum to "+usd(sum/100)+". The stated profit is "+usd(stated/100)+".";
}
function owedTie(data){
  const sum=(data.past_due||[]).reduce((s,r)=>s+(cents(r.amount)||0),0);
  const stated=cents(data.kpis&&data.kpis.owed);
  if(stated===null||sum===stated) return "";
  return "The past-due list sums to "+usd(sum/100)+". Owed is "+usd(stated/100)+".";
}
function splitOk(data){
  const rule=data.split_rule, split=data.split;
  if(!rule||!split||!split.shares) return false;
  const ids=Object.keys(split.shares);
  if(!ids.length) return false;
  let total=0, baseSum=0, remSum=0;
  for(let i=0;i<ids.length;i++){
    const s=split.shares[ids[i]];
    if(!s) return false;
    const b=cents(s.base), r=cents(s.remainder), t=cents(s.total);
    if(b===null||r===null||t===null||b+r!==t) return false;
    total+=t; baseSum+=b; remSum+=r;
  }
  if(cents(split.profit)===null||total!==cents(split.profit)) return false;
  if(!data.kpis||cents(data.kpis.profit)!==cents(split.profit)) return false;
  if(baseSum+remSum!==cents(split.profit)) return false;
  if(cents(split.remainder)!==remSum||cents(split.base)!==baseSum) return false;
  if(cents(split.profit)-cents(split.base)!==cents(split.remainder)) return false;
  if(cents(split.base)>cents(rule.base_amount)) return false;
  if(cents(split.profit)>=cents(rule.base_amount)&&cents(split.base)!==cents(rule.base_amount)) return false;
  const basePartner=split.shares[rule.base_partner];
  if(!basePartner||cents(basePartner.base)!==cents(split.base)) return false;
  if(rule.remainder_share===0.5){
    const parts=ids.map(id=>cents(split.shares[id].remainder));
    for(let i=1;i<parts.length;i++) if(parts[i]!==parts[0]) return false;
  }
  return true;
}
function statusSum(data){
  return (data.customer_status||[]).reduce((s,row)=>s+Number(row.count||0),0);
}
function pendingLabels(data){
  return (data.products||[]).filter(p=>p.profit_pending).map(p=>p.label);
}
function headerHTML(data){
  const names=joinNames((data.partners||[]).map(p=>p.name));
  const legal=data.company?names+" · "+data.company:names;
  return `<div>
      <p class="eyebrow">ProEdge</p>
      <h1>Partner dashboard</h1>
      <p class="subhead">${esc(legal)}</p>
    </div>
    <p class="asof">As of <time datetime="${esc(data.as_of)}">${esc(formatLong(data.as_of))}</time></p>`;
}
function kpisHTML(data){
  const k=data.kpis||{};
  const pending=pendingLabels(data);
  let profitHint="After affiliate payouts.";
  if(pending.length) profitHint+=" Excludes "+pending.join(", ")+" (pending).";
  const owedHint=((data.past_due||[]).length)+" past due";
  return `<section>
    <p class="kicker">${esc(monthProgress(data.as_of).label+" "+monthProgress(data.as_of).year)}</p>
    <div class="kpis">
      <article class="kpi" data-kpi="revenue"><p class="label">Total revenue</p><p class="value">${esc(usd(k.revenue))}</p></article>
      <article class="kpi" data-kpi="profit"><p class="label">Total profit</p><p class="value">${esc(usd(k.profit))}</p><p class="hint">${esc(profitHint)}</p></article>
      <article class="kpi" data-kpi="affiliate"><p class="label">Affiliate payouts</p><p class="value">${esc(usd(k.affiliate_payouts))}</p><p class="hint">${esc(k.affiliate_note||"")}</p></article>
      <article class="kpi owed" data-kpi="owed"><p class="label">Owed</p><p class="value">${esc(usd(k.owed))}</p><p class="hint">${esc(owedHint)}</p></article>
    </div>
  </section>`;
}
function tieHTML(data){
  const notes=[];
  const rev=revenueTie(data); if(rev) notes.push(rev);
  const prof=profitTie(data); if(prof) notes.push(prof);
  if(!splitOk(data)) notes.push("The partner split does not match the rule stored with this snapshot.");
  return notes.map(n=>`<p class="note">${esc(n)}</p>`).join("");
}
function formulaSegments(data){
  const rule=data.split_rule, shares=data.split.shares;
  const half=rule.remainder_share===0.5?"half":"share";
  const segs=[];
  const baseId=rule.base_partner;
  const base=shares[baseId];
  if(base&&cents(base.base)>0) segs.push({id:baseId,kind:"base",amount:base.base,label:nameOf(data,baseId)+" base",color:partnerColor(baseId,0)});
  if(base&&cents(base.remainder)>0){
    segs.push({id:baseId,kind:"remainder",amount:base.remainder,label:nameOf(data,baseId)+" "+half,color:SEGMENT_ALT[baseId]||partnerColor(baseId,0)});
  }
  (data.partners||[]).forEach((p,i)=>{
    if(p.id===baseId) return;
    const s=shares[p.id];
    if(!s) return;
    if(cents(s.base)>0) segs.push({id:p.id,kind:"base",amount:s.base,label:p.name+" base",color:partnerColor(p.id,i)});
    if(cents(s.remainder)>0) segs.push({id:p.id,kind:"remainder",amount:s.remainder,label:p.name+" "+half,color:partnerColor(p.id,i)});
  });
  return segs;
}
function partnerHint(share,rule){
  const half=rule.remainder_share===0.5?"half of the remainder":"share of the remainder";
  if(cents(share.base)>0&&cents(share.remainder)>0) return usd(share.base)+" base + "+half;
  if(cents(share.base)>0) return usd(share.base)+" base";
  if(cents(share.remainder)>0) return half.charAt(0).toUpperCase()+half.slice(1);
  return "";
}
function ruleText(data){
  const rule=data.split_rule;
  const pct=Math.round(Number(rule.remainder_share)*100);
  let text="The first "+usd(rule.base_amount)+" of monthly profit goes to "+nameOf(data,rule.base_partner)+". The remainder splits "+pct+"/"+(100-pct)+".";
  if(rule.carryforward===false) text+=" No carryforward.";
  return text;
}
function splitHTML(data){
  const segs=formulaSegments(data);
  const aria=segs.map(s=>s.label+" "+usd(s.amount)).join(", ");
  const cards=(data.partners||[]).map((p,i)=>{
    const share=data.split.shares[p.id]||{};
    const color=partnerColor(p.id,i);
    return `<article class="partner" data-partner="${esc(p.id)}" style="box-shadow:inset 3px 0 0 ${color}">
      <p class="label">${esc(p.name)}</p>
      <p class="value">${moneyHtml(share.total,false)}</p>
      <p class="hint">${esc(partnerHint(share,data.split_rule))}</p>
    </article>`;
  }).join("");
  const bar=segs.map(s=>`<span style="flex:${Number(s.amount)} ${Number(s.amount)} 0;background:${s.color}"></span>`).join("");
  const key=segs.map(s=>`<li><i class="swatch" style="background:${s.color}"></i>${esc(s.label)} ${esc(usd(s.amount))}</li>`).join("");
  return `<section class="panel" id="split">
    <p class="kicker">Partners</p>
    <h2>Partner split</h2>
    <p class="lede">The base is paid first. What remains is split. Nothing carries into the next month.</p>
    <div class="split">
      <div class="donut-wrap">
        <div class="chart-box donut"><canvas id="splitChart"></canvas></div>
        <div class="donut-center"><span>Profit</span><strong>${esc(usd(data.split.profit))}</strong></div>
      </div>
      <div class="partners">${cards}</div>
    </div>
    <div class="formula">
      <div class="bar" role="img" aria-label="${esc(aria)}">${bar}</div>
      <ul class="formula-key">${key}</ul>
      <p class="rule">${esc(ruleText(data))}</p>
    </div>
  </section>`;
}
function productChartHTML(){
  return `<section class="panel">
    <p class="kicker">Product lines</p>
    <h2>Profit by product line</h2>
    <p class="lede">Revenue beside profit. A blank profit bar is pending, not zero.</p>
    <div class="chart-box" role="img" aria-label="Horizontal bar chart of revenue and profit by product line."><canvas id="productChart"></canvas></div>
    <ul class="legend">
      <li><i class="swatch" style="background:#8eafc4"></i>Revenue</li>
      <li><i class="swatch" style="background:#c6a46a"></i>Profit</li>
    </ul>
  </section>`;
}
function cardFine(p){
  const bits=[];
  if(p.vendor_cost_note) bits.push(p.vendor_cost_note);
  if(p.note) bits.push(p.note);
  if(!bridges(p)) bits.push("Revenue, vendor cost, and affiliate payouts do not bridge to profit.");
  return bits.join(" · ");
}
function productCardsHTML(data){
  const cards=(data.products||[]).map(p=>{
    const health=healthOf(p);
    const aff=p.affiliate_payouts===undefined||p.affiliate_payouts===null?"":`<div><dt>Affiliate payouts</dt><dd>${moneyHtml(p.affiliate_payouts,false)}</dd></div>`;
    const fine=cardFine(p);
    const detail=p.detail?`<p class="detail">${esc(p.detail)}</p>`:"";
    return `<article class="pcard" data-product="${esc(p.id)}">
      <header>
        <div><h3>${esc(p.label)}</h3>${detail}</div>
        <span class="badge ${health.tone}">${esc(health.label)}</span>
      </header>
      <p class="cust"><strong>${esc(p.customers)}</strong> ${esc(p.count_label||"customers")}</p>
      <dl>
        <div><dt>Revenue</dt><dd>${moneyHtml(p.revenue,false)}</dd></div>
        <div><dt>Vendor cost</dt><dd>${moneyHtml(p.vendor_cost,false)}</dd></div>
        ${aff}
        <div class="profit"><dt>Profit</dt><dd>${moneyHtml(p.profit,p.profit_pending)}</dd></div>
      </dl>
      ${fine?`<p class="fine">${esc(fine)}</p>`:""}
    </article>`;
  }).join("");
  return `<section class="block">
    <p class="kicker">Lines</p>
    <h2>Product line status</h2>
    <div class="cards">${cards}</div>
  </section>`;
}
function failedLabel(iso){return iso?"Failed "+formatShort(iso):"Failed date pending";}
function statusHTML(data){
  const rows=data.customer_status||[];
  const sum=statusSum(data);
  const unique=data.unique_customers;
  const mismatch=Number(unique)!==sum
    ?`<p class="note">These statuses sum to ${esc(sum)}. Unique customers are ${esc(unique)}.</p>`
    :"";
  const legend=rows.map(row=>{
    const color=STATUS_COLOR[row.id]||"#9aa6b2";
    return `<li><i class="swatch" style="background:${color}"></i>${esc(row.label)}<b>${esc(row.count)}</b></li>`;
  }).join("");
  const due=(data.past_due||[]).map(r=>`<div class="due">
      <div><div class="who">${esc(r.name)}</div><div class="when">${esc(failedLabel(r.failed))}</div></div>
      <div class="amt">${esc(usd(r.amount))}</div>
    </div>`).join("");
  const owedNote=owedTie(data);
  const listSum=(data.past_due||[]).reduce((s,r)=>s+(cents(r.amount)||0),0);
  return `<section class="panel">
    <p class="kicker">Customers</p>
    <h2>Customer status</h2>
    <div class="status">
      <div>
        <p class="unique"><strong>${esc(unique)}</strong> unique</p>
        ${data.unique_customer_note?`<p class="lede">${esc(data.unique_customer_note)}</p>`:""}
        <div class="chart-box status" role="img" aria-label="Stacked bar of customer status counts."><canvas id="statusChart"></canvas></div>
        <ul class="legend">${legend}</ul>
        ${mismatch}
      </div>
      <div>
        <h3>Past due</h3>
        ${due||`<p class="lede">None</p>`}
        <p class="due-total"><span>Total owed</span><b>${esc(usd(listSum/100))}</b></p>
        ${owedNote?`<p class="note">${esc(owedNote)}</p>`:""}
      </div>
    </div>
  </section>`;
}
function weeklyRows(data){
  return Array.isArray(data.weekly_actuals)?data.weekly_actuals:[];
}
function weeklyReady(rows){
  return rows.some(r=>r&&[r.income,r.expense,r.profit].some(v=>v!==null&&v!==undefined&&v!==""));
}
function weeklyActualsHTML(data){
  const rows=weeklyRows(data);
  if(!weeklyReady(rows)){
    return `<section class="panel" id="weekly-actuals">
      <p class="kicker">TD Bank</p>
      <h2>4-week Income / Expense / Profit</h2>
      <p class="pending-line">TD Bank weekly actuals pending</p>
    </section>`;
  }
  return `<section class="panel" id="weekly-actuals">
    <p class="kicker">TD Bank</p>
    <h2>4-week Income / Expense / Profit</h2>
    <ul class="legend">
      <li><i class="swatch" style="background:#8eafc4"></i>Income</li>
      <li><i class="swatch" style="background:#e08b84"></i>Expense</li>
      <li><i class="swatch" style="background:#c6a46a"></i>Profit</li>
    </ul>
    <div class="chart-box line" role="img" aria-label="Grouped bars of weekly income and expense with a profit line."><canvas id="weeklyChart"></canvas></div>
  </section>`;
}
function trendHTML(data){
  const prog=monthProgress(data.as_of);
  const pct=Math.max(0,Math.min(100,Math.round((prog.day/prog.days)*1000)/10));
  const count=(data.snapshots||[]).length;
  return `<section class="panel">
    <p class="kicker">Through the month</p>
    <h2>Month progress</h2>
    <div class="month">
      <div class="month-top"><span>${esc(prog.label+" "+prog.year)}</span><span>Day ${esc(prog.day)} of ${esc(prog.days)}</span></div>
      <div class="track" role="img" aria-label="${esc(prog.label+" is on day "+prog.day+" of "+prog.days)}"><div class="fill" style="width:${pct}%"></div></div>
    </div>
    <p class="lede">${esc(count)} weekly snapshot${count===1?"":"s"} so far. Blank weeks have no snapshot yet, and they are not zeros.</p>
    <ul class="legend">
      <li><i class="swatch" style="background:#8eafc4"></i>Revenue</li>
      <li><i class="swatch" style="background:#c6a46a"></i>Profit</li>
    </ul>
    <div class="chart-box line" role="img" aria-label="Line chart of weekly revenue and profit snapshots."><canvas id="trendChart"></canvas></div>
  </section>`;
}
function buildWeeks(current,history){
  const keys=mondaysInMonth(current.as_of).slice();
  const byWeek=new Map();
  (history||[]).forEach(snap=>{
    if(!snap||!snap.as_of||!snap.kpis) return;
    const key=mondayOnOrBefore(snap.as_of);
    const prev=byWeek.get(key);
    if(!prev||String(snap.as_of)>String(prev.as_of)) byWeek.set(key,snap);
  });
  byWeek.forEach((_,key)=>{ if(keys.indexOf(key)===-1) keys.push(key); });
  keys.sort();
  return keys.map(key=>{
    const snap=byWeek.get(key)||null;
    return {
      week:key,
      label:snap?formatShort(snap.as_of):formatShort(key),
      snap:snap?snap.as_of:null,
      revenue:snap?snap.kpis.revenue:null,
      profit:snap?snap.kpis.profit:null
    };
  });
}
function axisMoney(value){
  const v=Number(value);
  if(!Number.isFinite(v)) return "";
  if(v===0) return "$0";
  const abs=Math.abs(v);
  if(abs>=1000){
    const n=v/1000;
    const body=Math.abs(n)>=10?n.toFixed(0):n.toFixed(n%1===0?0:1);
    return (v<0?"-":"")+"$"+body.replace("-","")+"k";
  }
  return usd(v);
}
function chartTooltip(){
  return {
    backgroundColor:"#0e1218",
    borderColor:"rgba(198,164,106,.45)",
    borderWidth:1,
    titleColor:"#e6d3ae",
    bodyColor:"#ebe6dc",
    padding:10,
    cornerRadius:8,
    callbacks:{
      label(ctx){
        const raw=ctx.raw;
        const name=ctx.dataset.label||ctx.label||"Value";
        if(raw===null||raw===undefined) return name+": pending";
        return name+": "+usd(raw);
      }
    }
  };
}
function chartAnim(){
  return false;
}
function scaleGrid(){
  return {color:"rgba(243,239,230,.08)",drawTicks:false};
}
function dropCharts(){
  while(charts.length){
    const chart=charts.pop();
    try{chart.destroy();}catch(e){}
  }
}
function paintCharts(data,history,chartsReady){
  if(!chartsReady||!window.Chart){
    document.querySelectorAll("#app .chart-box").forEach(box=>{
      const note=document.createElement("p");
      note.className="chart-missing";
      note.textContent="The chart could not be loaded.";
      box.appendChild(note);
    });
    return;
  }
  Chart.defaults.color="#c8bfb2";
  Chart.defaults.font.family='-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif';
  Chart.defaults.font.size=12;
  const products=data.products||[];
  charts.push(new Chart(document.getElementById("productChart"),{
    type:"bar",
    data:{
      labels:products.map(p=>p.label),
      datasets:[
        {label:"Revenue",data:products.map(p=>p.revenue),backgroundColor:"#8eafc4",borderRadius:4,borderSkipped:false,maxBarThickness:14},
        {label:"Profit",data:products.map(p=>p.profit_pending?null:p.profit),backgroundColor:"#c6a46a",borderRadius:4,borderSkipped:false,maxBarThickness:14}
      ]
    },
    options:{
      indexAxis:"y",
      responsive:true,
      maintainAspectRatio:false,
      animation:chartAnim(),
      plugins:{legend:{display:false},tooltip:chartTooltip()},
      scales:{
        y:{grid:{display:false},border:{display:false},ticks:{autoSkip:false,color:"#ebe6dc"}},
        x:{beginAtZero:true,grace:"6%",grid:scaleGrid(),border:{display:false},ticks:{callback:axisMoney,maxTicksLimit:5}}
      }
    }
  }));
  const partners=data.partners||[];
  charts.push(new Chart(document.getElementById("splitChart"),{
    type:"doughnut",
    data:{
      labels:partners.map(p=>p.name),
      datasets:[{
        data:partners.map(p=>data.split.shares[p.id].total),
        backgroundColor:partners.map((p,i)=>partnerColor(p.id,i)),
        borderColor:"#1a1f27",
        borderWidth:3,
        hoverOffset:4
      }]
    },
    options:{
      cutout:"68%",
      responsive:true,
      maintainAspectRatio:false,
      animation:chartAnim(),
      plugins:{legend:{display:false},tooltip:chartTooltip()}
    }
  }));
  const statuses=data.customer_status||[];
  charts.push(new Chart(document.getElementById("statusChart"),{
    type:"bar",
    data:{
      labels:["Customers"],
      datasets:statuses.map(row=>({
        label:row.label,
        data:[row.count],
        backgroundColor:STATUS_COLOR[row.id]||"#9aa6b2",
        borderWidth:0,
        barPercentage:.55
      }))
    },
    options:{
      indexAxis:"y",
      responsive:true,
      maintainAspectRatio:false,
      animation:chartAnim(),
      plugins:{legend:{display:false},tooltip:chartTooltip()},
      scales:{
        x:{stacked:true,grid:scaleGrid(),border:{display:false},ticks:{precision:0}},
        y:{stacked:true,display:false}
      }
    }
  }));
  const actuals=weeklyRows(data).filter(r=>r&&r.week_start);
  const weeklyCanvas=document.getElementById("weeklyChart");
  if(weeklyCanvas&&weeklyReady(actuals)){
    charts.push(new Chart(weeklyCanvas,{
      type:"bar",
      data:{
        labels:actuals.map(r=>formatShort(r.week_start)),
        datasets:[
          {type:"bar",label:"Income",data:actuals.map(r=>r.income??null),backgroundColor:"#8eafc4",borderRadius:4,maxBarThickness:28},
          {type:"bar",label:"Expense",data:actuals.map(r=>r.expense??null),backgroundColor:"#e08b84",borderRadius:4,maxBarThickness:28},
          {type:"line",label:"Profit",data:actuals.map(r=>r.profit??null),borderColor:"#c6a46a",backgroundColor:"#c6a46a",pointBackgroundColor:"#c6a46a",pointRadius:4,tension:.25,spanGaps:false}
        ]
      },
      options:{
        responsive:true,
        maintainAspectRatio:false,
        animation:chartAnim(),
        plugins:{legend:{display:false},tooltip:chartTooltip()},
        scales:{
          y:{beginAtZero:true,grid:scaleGrid(),border:{display:false},ticks:{callback:axisMoney,maxTicksLimit:5}},
          x:{grid:{display:false},border:{display:false}}
        }
      }
    }));
  }
  const weeks=buildWeeks(data,history);
  charts.push(new Chart(document.getElementById("trendChart"),{
    type:"line",
    data:{
      labels:weeks.map(w=>w.label),
      datasets:[
        {label:"Revenue",data:weeks.map(w=>w.revenue),borderColor:"#8eafc4",backgroundColor:"rgba(142,175,196,.14)",pointBackgroundColor:"#8eafc4",pointRadius:4,tension:.25,fill:true,spanGaps:false},
        {label:"Profit",data:weeks.map(w=>w.profit),borderColor:"#c6a46a",backgroundColor:"rgba(198,164,106,.14)",pointBackgroundColor:"#c6a46a",pointRadius:4,tension:.25,fill:true,spanGaps:false}
      ]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      animation:chartAnim(),
      plugins:{
        legend:{display:false},
        tooltip:Object.assign(chartTooltip(),{
          callbacks:{
            title(items){
              const row=weeks[items[0].dataIndex];
              return row.snap?"Snapshot "+formatLong(row.snap):"Week of "+row.label;
            },
            label(ctx){
              const raw=ctx.raw;
              if(raw===null||raw===undefined) return ctx.dataset.label+": pending";
              return ctx.dataset.label+": "+usd(raw);
            }
          }
        })
      },
      scales:{
        y:{beginAtZero:true,grid:scaleGrid(),border:{display:false},ticks:{callback:axisMoney,maxTicksLimit:5}},
        x:{grid:{display:false},border:{display:false}}
      }
    }
  }));
}
function loadChartJs(){
  if(window.Chart) return Promise.resolve();
  return new Promise((resolve,reject)=>{
    const s=document.createElement("script");
    s.src="vendor/chart.umd.min.js";
    s.onload=()=>resolve();
    s.onerror=()=>reject(new Error("chart"));
    document.head.appendChild(s);
  });
}
async function fetchJson(url){
  const res=await fetch(url,{cache:"no-cache"});
  if(!res.ok) throw new Error(String(res.status));
  return res.json();
}
async function loadHistory(current){
  const dates=(current.snapshots&&current.snapshots.length)?current.snapshots.slice():[current.as_of];
  const out=[];
  for(let i=0;i<dates.length;i++){
    const date=dates[i];
    try{
      out.push(await fetchJson("data/history/"+encodeURIComponent(date)+".json"));
    }catch(e){
      if(current.as_of===date) out.push(current);
    }
  }
  out.sort((a,b)=>String(a.as_of).localeCompare(String(b.as_of)));
  return out;
}
async function render(){
  const root=document.getElementById("dashboard");
  try{
    const current=await fetchJson("data/current.json");
    const history=await loadHistory(current);
    let chartsReady=true;
    try{await loadChartJs();}catch(e){chartsReady=false;}
    dropCharts();
    document.getElementById("top").innerHTML=headerHTML(current);
    root.innerHTML=kpisHTML(current)+tieHTML(current)+splitHTML(current)+productChartHTML()+productCardsHTML(current)+statusHTML(current)+trendHTML(current)+weeklyActualsHTML(current);
    const foot=document.getElementById("foot");
    if(foot) foot.textContent=current.company||"";
    try{paintCharts(current,history,chartsReady);}
    catch(err){
      document.querySelectorAll("#app .chart-box").forEach(box=>{
        if(box.querySelector(".chart-missing")) return;
        const note=document.createElement("p");
        note.className="chart-missing";
        note.textContent="The chart could not be loaded.";
        box.appendChild(note);
      });
    }
    root.dataset.rendered="1";
  }catch(e){
    root.textContent="The dashboard data could not be loaded.";
  }
}
if(sessionStorage.getItem("sbs_dash_ok")==="1") openApp();
