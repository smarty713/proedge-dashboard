<style>
:root{--navy:#1F4E79;--navy-dark:#0F3A5F;--ink:#1a2330;--muted:#5b6775;--line:#d0d5dd;--bg:#f4f6f8;--card:#fff;--risk:#8b1e1e}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4}
#gate{position:fixed;inset:0;background:var(--navy-dark);color:#fff;display:flex;align-items:center;justify-content:center;z-index:20;padding:24px}
#gate.hidden{display:none}
.gate-box{width:min(420px,100%);background:#0c2d4a;padding:28px;border-radius:12px}
.gate-box h1{font-size:1.15rem;margin:0 0 8px}
.gate-box p{color:#c9d7e6;font-size:.85rem;margin:0 0 16px}
.gate-box input{width:100%;padding:10px 12px;border:1px solid #3a5d7a;border-radius:8px;background:#082238;color:#fff;font-size:1rem}
.gate-box button{margin-top:12px;width:100%;padding:10px 12px;border:0;border-radius:8px;background:#4ea3e0;color:#072033;font-weight:700;cursor:pointer}
.gate-error{color:#ffb4b4;font-size:.85rem;margin-top:8px;min-height:1.2em}
header{background:var(--navy-dark);color:#fff;padding:14px 20px}
header h1{margin:0;font-size:1rem;font-weight:600}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
.table-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--navy);color:#fff;font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
td.num,th.num{text-align:right;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-bottom:0;border-top:2px solid var(--navy);font-weight:700;background:#eef3f8}
.risk{color:var(--risk)}
details{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0}
details summary{cursor:pointer;padding:12px 16px;font-weight:600;color:var(--navy);list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ ";display:inline-block;width:1.1em}
details[open] summary::before{content:"▾ "}
details .table-wrap{border:0;border-top:1px solid var(--line);border-radius:0 0 10px 10px}
@media (max-width:600px){
  html,body{font-size:15px}
  th,td{padding:8px 10px}
  header{padding:12px 16px}
  .wrap{padding:14px 10px 32px}
}
</style>
</head>
<body>
<div id="gate">
  <form class="gate-box" onsubmit="return unlock(event)">
    <h1>SP Smart Business Solutions LLC</h1>
    <p>Enter the passcode to view.</p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Passcode" autofocus>
    <button type="submit">Open</button>
    <div class="gate-error" id="gate-err"></div>
  </form>
</div>
<div id="app" hidden>
  <header>
    <h1>SP Smart Business Solutions LLC</h1>
  </header>
  <div class="wrap">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Product</th>
            <th class="num">Customers</th>
            <th class="num">MRR</th>
            <th class="num">Unpaid (3 mo)</th>
          </tr>
        </thead>
        <tbody id="lines"></tbody>
        <tfoot id="totals"></tfoot>
      </table>
    </div>
    <details>
      <summary>Customers in arrears</summary>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Products</th>
              <th class="num">Total unpaid</th>
              <th>Last failed date</th>
            </tr>
          </thead>
          <tbody id="arrears"></tbody>
        </table>
      </div>
    </details>
  </div>
</div>

async function sha256hex(text){
  const enc=new TextEncoder().encode(text);
  if(window.crypto&&window.crypto.subtle){
    const buf=await window.crypto.subtle.digest("SHA-256",enc);
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  return sha256fallback(text);
}
function sha256fallback(ascii){
  function rotr(x,n){return (x>>>n)|(x<<(32-n));}
  const K=[1116352408,1899447441,3049323471,3921009573,961987163,1508970993,2453635748,2870763221,3624381080,310598401,607225278,1426881987,1925078388,2162078206,2614888103,3248222580,3835390401,4022224774,264347078,604807628,770255983,1249150122,1555081692,1996064986,2554220882,2821834349,2952999808,3210313671,3336571891,3584528711,113926993,338241895,666307205,773529912,1294757372,1396182291,1695183700,1986661051,2177026350,2456956037,2730485921,2820302411,3259730800,3345764771,3516065817,3600352804,4094571909,275423344,430227734,506948616,659060556,883997877,958139571,1322822218,1537002063,1747873779,1955562222,2024104815,2227730452,2361852424,2428436474,2756734187,3204031479,3329325298];
  function toWords(s){
    const bytes=[];
    for(let i=0;i<s.length;i++) bytes.push(s.charCodeAt(i)&0xff);
    const bitLen=bytes.length*8;
    bytes.push(0x80);
    while((bytes.length%64)!==56) bytes.push(0);
    for(let i=7;i>=0;i--) bytes.push((bitLen/Math.pow(2,i*8))&0xff);
    const w=[];
    for(let i=0;i<bytes.length;i+=4) w.push(((bytes[i]<<24)|(bytes[i+1]<<16)|(bytes[i+2]<<8)|bytes[i+3])>>>0);
    return w;
  }
  let h=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225];
  const words=toWords(unescape(encodeURIComponent(ascii)));
  for(let i=0;i<words.length;i+=16){
    const w=words.slice(i,i+16);
    for(let t=16;t<64;t++){
      const s0=rotr(w[t-15],7)^rotr(w[t-15],18)^(w[t-15]>>>3);
      const s1=rotr(w[t-2],17)^rotr(w[t-2],19)^(w[t-2]>>>10);
      w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0;
    }
    let [a,b,c,d,e,f,g,hh]=h;
    for(let t=0;t<64;t++){
      const S1=rotr(e,6)^rotr(e,11)^rotr(e,25);
      const ch=(e&f)^(~e&g);
      const t1=(hh+S1+ch+K[t]+w[t])>>>0;
      const S0=rotr(a,2)^rotr(a,13)^rotr(a,22);
      const maj=(a&b)^(a&c)^(b&c);
      const t2=(S0+maj)>>>0;
      hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;
    }
    h=h.map((x,i)=>(x+[a,b,c,d,e,f,g,hh][i])>>>0);
  }
  return h.map(x=>("00000000"+x.toString(16)).slice(-8)).join("");
}
function usd(n){if(n===null||n===undefined)return "—";return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n);}
function esc(s){return String(s??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));}
function unlock(ev){
  ev.preventDefault();
  const val=document.getElementById("pw").value||"";
  sha256hex(val).then(h=>{
    if(h===PWHASH){sessionStorage.setItem("sbs_dash_ok","1");openApp();}
    else document.getElementById("gate-err").textContent="That passcode does not match.";
  });
  return false;
}
function openApp(){document.getElementById("gate").classList.add("hidden");document.getElementById("app").hidden=false;render();}
function render(){
  const d=DATA;
  const lines=d.lines||[];
  let cust=0,mrr=0,unpaid=0;
  document.getElementById("lines").innerHTML=lines.map(s=>{
    cust+=Number(s.customers||0);
    mrr+=Number(s.mrr||0);
    unpaid+=Number(s.unpaid||0);
    const risk=Number(s.unpaid||0)>0?" risk":"";
    return `<tr>
      <td>${esc(s.label)}</td>
      <td class="num">${esc(s.customers)}</td>
      <td class="num">${usd(s.mrr)}</td>
      <td class="num${risk}">${usd(s.unpaid)}</td>
    </tr>`;
  }).join("");
  const totalRisk=unpaid>0?" risk":"";
  document.getElementById("totals").innerHTML=`<tr>
    <td>Total</td>
    <td class="num">${cust}</td>
    <td class="num">${usd(mrr)}</td>
    <td class="num${totalRisk}">${usd(unpaid)}</td>
  </tr>`;
  const rows=d.arrears||[];
  document.getElementById("arrears").innerHTML=rows.length
    ? rows.map(r=>`<tr>
        <td>${esc(r.name)}</td>
        <td>${esc(r.products)}</td>
        <td class="num">${usd(r.total)}</td>
        <td>${esc(r.last_failed||"")}</td>
      </tr>`).join("")
    : `<tr><td colspan="4">None</td></tr>`;
}
